# Modified for Orchestrator Board by Gama Software, 2026 (OB-1).

name: Frontend

# Runs the renderer vitest suite and typechecks the codebase.
#
# This job ensures both compiler/type checking passes and vitest tests succeed.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install lint dependencies without Electron build scripts
        run: npm ci --ignore-scripts
      - name: Lint frontend
        run: npm run lint
      - name: Verify lint rules reject new violations
        run: npm run lint:test

  mac-update-helper:
    # Keep this on Intel to exercise the x64 release target natively while
    # Swift cross-compiles and lipo-verifies the arm64 helper.
    runs-on: macos-26-intel
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test native helper build configuration
        run: node --test scripts/build-update-helper.node-test.mjs
      - name: Test repair installer packaging and guards
        run: node --test scripts/build-mac-repair-installer.node-test.mjs
      - name: Compile helper for both macOS architectures
        run: |
          node scripts/build-update-helper.mjs --arch x64
          lipo update-helper/ao-update-progress -verify_arch x86_64
          node scripts/build-update-helper.mjs --arch arm64
          lipo update-helper/ao-update-progress -verify_arch arm64
      - name: Run native update state tests
        run: |
          mkdir -p "$HOME/.ao/build-cache/update-helper/tests"
          xcrun swiftc -module-cache-path "$HOME/.ao/build-cache/update-helper/tests" native/update-helper/UpdateProgressState.swift native/update-helper/StateTests.swift -o "$HOME/.ao/build-cache/update-helper/state-tests"
          "$HOME/.ao/build-cache/update-helper/state-tests"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the source-build runtime in bootstrap-self-hosted.sh.
          node-version: 22.23.2
      - name: Check self-hosted npm lockfile compatibility
        run: npm ci --ignore-scripts --dry-run --no-audit --no-fund

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/src/docs/package-lock.json
            packages/cloud-client/package-lock.json
            packages/product-ui/package-lock.json

      - name: Install frontend dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "npm ci failed; retrying Electron dependency download ($attempt/3)"
          done

      - name: Install Cloud client dependencies
        run: npm ci
        working-directory: packages/cloud-client

      - name: Install product UI dependencies
        run: npm ci
        working-directory: packages/product-ui

      - name: Verify Cloud contract and client
        run: |
          npm run generate
          git diff --exit-code -- src/schema.ts
          test -z "$(git ls-files --others --exclude-standard -- src/schema.ts)"
          npm run typecheck
          npm test
          npm pack --dry-run
        working-directory: packages/cloud-client

      - name: Verify product UI package
        run: |
          npm run typecheck
          npm test
          npm pack --dry-run
        working-directory: packages/product-ui

      - name: Prepare pinned agent-browser runtime
        run: npm run browser-runtime:prepare -- --quiet

      - name: Install docs dependencies
        run: npm ci --prefix src/docs

      - name: Build docs
        run: npm run build --prefix src/docs

      - name: Typecheck project
        run: npm run typecheck

      - name: Typecheck E2E suite
        run: npm run typecheck:e2e

      - name: Run vitest suite
        env:
          AO_AGENT_BROWSER_TEST_BINARY: ${{ github.workspace }}/frontend/agent-browser/agent-browser
        run: npm test -- --reporter=default --reporter=junit --outputFile=test-results/vitest.xml

      - name: Run guarded-navigation browser integration
        run: npm run test:browser-postcondition-integration

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-tests
          path: frontend/test-results/vitest.xml
          retention-days: 7

  renderer-smoke:
    # RENDERER smoke (issue #2483, renderer slice) — the Playwright specs that run
    # the renderer under `dev:web` with an injected window.ao + fake CDC/snapshot.
    # This is fast renderer-regression coverage; it is NOT the canonical T0/P0
    # end-to-end gate. Real daemon/storage/API/preload/PTY/FS boundaries are
    # exercised by the packaged-app pod gate (#2697), not here.
    # playwright.config starts `dev:web` itself (webServer); the pinned container
    # provides Chromium and its system dependencies without a live apt install.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Keep this aligned with Playwright in frontend/package-lock.json.
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # The performance fixture imports real renderer components, which in turn
      # typecheck product-ui source through the frontend's TS path alias.
      - name: Install product UI dependencies
        run: npm ci
        working-directory: packages/product-ui

      - name: Typecheck e2e suite
        # Playwright transpiles specs without typechecking, so the
        # `satisfies AoBridge` guard in e2e/support/fake-bridge.ts (the
        # preload-drift tripwire) is only enforced by this step.
        run: npm run typecheck:e2e

      - name: Run renderer smoke suite
        run: CI=true npm run test:e2e:renderer

      - name: Upload renderer reports and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-smoke
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
