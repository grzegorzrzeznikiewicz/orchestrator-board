<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Orchestrator Board — Gama Software</title>
  <desc>Gama Software's three blue diamonds beside a three-column workflow board.</desc>
  <defs>
    <linearGradient id="brandBlue" x1="180" y1="180" x2="750" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2D7DF0"/><stop offset="1" stop-color="#1559CF"/>
    </linearGradient>
    <linearGradient id="surface" x2="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#EAF3FF"/></linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="#F8FBFF"/>
  <rect x="64" y="64" width="896" height="896" rx="192" fill="#FFFFFF" stroke="#DCEAFF" stroke-width="10"/>
  <!-- Owner-supplied Gama diamond arrangement, adapted as editable vectors. -->
  <g fill="url(#brandBlue)">
    <rect x="127" y="399" width="156" height="156" rx="25" transform="rotate(-45 205 477)"/>
    <rect x="232" y="280" width="174" height="174" rx="28" transform="rotate(-45 319 367)"/>
    <rect x="232" y="512" width="174" height="174" rx="28" transform="rotate(-45 319 599)"/>
  </g>
  <!-- Three workflow columns, staggered cards, and a forward progression. -->
  <rect x="434" y="300" width="440" height="444" rx="48" fill="url(#surface)" stroke="#1559CF" stroke-width="24"/>
  <path d="M449 392h410M581 413v300M729 413v300" fill="none" stroke="#A3C7FA" stroke-width="14"/>
  <g fill="#1559CF"><circle cx="478" cy="349" r="11"/><circle cx="517" cy="349" r="11"/><circle cx="556" cy="349" r="11"/></g>
  <g fill="url(#brandBlue)"><rect x="467" y="435" width="85" height="105" rx="16"/><rect x="613" y="493" width="85" height="105" rx="16"/><rect x="759" y="551" width="85" height="105" rx="16"/></g>
  <path d="m779 602 16 16 29-35" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
